<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Construction Safety Program · Van's Plumbing &amp; Heating</title>
<link rel="icon" href="/favicon.png">
<style>
/* The field safety manual, opened from the QR sticker on a hard hat. Page images
   (every page of the PDF, so the scanned data sheets read the same as the rest),
   a contents list, and the PDF itself for anyone who wants the file. */
:root {
  --bar: #11191c; --bar-ink: #eef3f4; --bar-dim: #a9b8bc;
  --bg: #d9dedf; --ink: #1b2326; --dim: #55636a; --line: #c3cacc;
  --red: #c42a2a; --blue: #1f7f93; --sheet: #fff;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 76px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header {
  position: sticky; top: 0; z-index: 5; background: var(--bar); color: var(--bar-ink);
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 10px rgb(0 0 0 / 0.25);
}
header img { height: 30px; width: auto; flex: none; }
.title { min-width: 0; flex: 1; }
.title b { display: block; font-size: 15px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title span { display: block; font-size: 12px; color: var(--bar-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 8px;
  border: 1px solid #3a4a50; background: #1d282c; color: var(--bar-ink); font: 600 14px system-ui, sans-serif; text-decoration: none; cursor: pointer;
}
.btn svg { width: 18px; height: 18px; }
main { max-width: 900px; margin: 0 auto; padding: 16px max(12px, env(safe-area-inset-right, 0px)) 48px max(12px, env(safe-area-inset-left, 0px)); }
.intro { background: var(--sheet); border-radius: 10px; padding: 16px; margin-bottom: 16px; border-left: 5px solid var(--red); }
.intro h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.2; }
.intro p { margin: 0; color: var(--dim); font-size: 14px; }
nav { background: var(--sheet); border-radius: 10px; padding: 6px 0; margin-bottom: 20px; }
nav h2 { margin: 0; padding: 10px 16px 6px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
nav ol { list-style: none; margin: 0; padding: 0; }
nav a { display: flex; justify-content: space-between; gap: 12px; padding: 11px 16px; color: var(--ink); text-decoration: none; border-top: 1px solid #eef0f1; }
nav a:active, nav a:hover { background: #f1f5f6; }
nav a span:last-child { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
nav li.sds a { font-weight: 600; color: var(--blue); }
.page { margin: 0 0 14px; }
.page img { display: block; width: 100%; height: auto; aspect-ratio: 1275 / 1650; background: var(--sheet); border-radius: 4px; box-shadow: 0 1px 4px rgb(0 0 0 / 0.18); }
.page figcaption { text-align: center; font-size: 12px; color: var(--dim); padding-top: 4px; }
.section-mark { margin: 26px 0 10px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.top { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--bar); color: var(--bar-ink); box-shadow: 0 2px 10px rgb(0 0 0 / 0.3);
  display: none; align-items: center; justify-content: center; cursor: pointer; }
.top.show { display: flex; }
.top svg { width: 22px; height: 22px; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
@media (max-width: 420px) { .btn .label { display: none; } }
</style>
</head>
<body>
<header>
  <img src="/safety/logo.png" alt="Van's">
  <div class="title"><b>Construction Safety Program</b><span>Van's Plumbing &amp; Heating, Inc.</span></div>
  <a class="btn" href="/safety/Vans-Safety.pdf" download>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg><span class="label">PDF</span>
  </a>
</header>
<main>
  <section class="intro">
    <h1>Construction Safety Program</h1>
    <p>Van's Plumbing &amp; Heating, Inc. · 13969 Francis Way, Cedar Springs, MI 49319 · <a href="tel:+16166961420">(616) 696-1420</a></p>
  </section>
  <nav aria-labelledby="contents"><h2 id="contents">Contents</h2><ol id="toc"></ol></nav>
  <div id="pages"></div>
</main>
<button class="top" id="top" type="button" aria-label="Back to contents">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
</button>
<script>
// PDF page numbers (the printed numbers in the manual differ).
const PAGES = 158;
const SECTIONS = [
  ["Safety and Health Policy", 3],
  ["Safety and Health Objectives", 4],
  ["Contractor Safety Administrator", 5],
  ["Job Site Inspections", 6],
  ["Safety Rules", 7],
  ["Job Safety Training", 10],
  ["Personal Protective Equipment", 11],
  ["Safety Discipline", 12],
  ["Confined Space Entry", 13],
  ["Confined Space Entry Procedures", 14],
  ["Emergency Procedures", 15],
  ["Written Hazard Communication Program", 16],
  ["Material Safety Data Sheets", 19, "sds"],
];
const toc = document.getElementById("toc");
for (const [name, page, cls] of SECTIONS) {
  const li = document.createElement("li");
  if (cls) li.className = cls;
  li.innerHTML = `<a href="#p${page}"><span></span><span>p. ${page}${cls ? `–${PAGES}` : ""}</span></a>`;
  li.querySelector("span").textContent = name;
  toc.append(li);
}
const starts = new Map(SECTIONS.map(([name, page]) => [page, name]));
const holder = document.getElementById("pages");
for (let n = 1; n <= PAGES; n++) {
  if (starts.has(n) && n === 19) {
    const h = document.createElement("h2");
    h.className = "section-mark";
    h.textContent = "Material Safety Data Sheets";
    holder.append(h);
  }
  const fig = document.createElement("figure");
  fig.className = "page";
  fig.id = `p${n}`;
  const img = document.createElement("img");
  img.src = `/safety/pages/${String(n).padStart(3, "0")}.webp`;
  img.alt = starts.has(n) ? `Page ${n}: ${starts.get(n)}` : `Page ${n}`;
  img.loading = n <= 2 ? "eager" : "lazy";
  img.decoding = "async";
  const cap = document.createElement("figcaption");
  cap.textContent = `Page ${n} of ${PAGES}`;
  fig.append(img, cap);
  holder.append(fig);
}
// A link to a page (#p40) works when it's opened, after the pages exist.
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
const toTop = document.getElementById("top");
const nav = document.querySelector("nav");
addEventListener("scroll", () => toTop.classList.toggle("show", nav.getBoundingClientRect().bottom < 0), { passive: true });
toTop.addEventListener("click", () => nav.scrollIntoView({ behavior: "smooth" }));
</script>
</body>
</html>
